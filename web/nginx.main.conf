# nginx.conf principal (substitui o da imagem). Ajustado para milhares de conexões
# simultâneas: cada usuário do teste de carga mantém a sua conexão keep-alive aberta.
worker_processes  2;
worker_rlimit_nofile 32768;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  8192;
    multi_accept on;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sem access log: a 1000+ req/s ele custa CPU e enche o log do kubelet. As métricas
    # de requisição vêm do /stats de cada serviço (aba Monitor).
    access_log off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;

    include /etc/nginx/conf.d/*.conf;
}
