# EXEMPLO. Não aplique este arquivo com estes valores: o scripts/deploy.sh cria o Secret
# real com senhas aleatórias. Mantido aqui para documentar as chaves esperadas.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: socialclone
type: Opaque
stringData:
  POSTGRES_PASSWORD: troque-me
  JWT_SECRET: troque-me
  USERS_DB_PASSWORD: troque-me
  ARTICLES_DB_PASSWORD: troque-me
  COMMENTS_DB_PASSWORD: troque-me
  USERS_DATABASE_URL: postgres://users_svc:troque-me@postgres:5432/users_db
  ARTICLES_DATABASE_URL: postgres://articles_svc:troque-me@postgres:5432/articles_db
  COMMENTS_DATABASE_URL: postgres://comments_svc:troque-me@postgres:5432/comments_db
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: socialclone
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: socialclone
  RABBITMQ_DEFAULT_PASS: troque-me
  AMQP_URL: amqp://socialclone:troque-me@rabbitmq:5672/%2f
