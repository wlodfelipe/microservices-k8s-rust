# Front-end (React estático) servido por nginx. O nginx também é o proxy reverso:
#   /api/*  → Service gateway   (API RealWorld)
#   /ops/*  → Service ops       (aba Monitor)
#   /*      → arquivos estáticos (SPA)
# É a única porta de entrada da aplicação (NodePort 30080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: socialclone
  labels:
    app: web
    tier: frontend
    app.kubernetes.io/part-of: socialclone
  annotations:
    socialclone/versions: "v1,v2,v3"
    socialclone/description: "SPA React + nginx (proxy reverso de /api e /ops)"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: localhost/socialclone/web:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            # Headless: um registro DNS por pod pronto do gateway (ver nginx.conf.template)
            - name: GATEWAY_UPSTREAM
              value: gateway-headless.socialclone.svc.cluster.local:8080
            - name: OPS_URL
              value: http://ops.socialclone.svc.cluster.local:8080
            # O entrypoint do nginx preenche ${NGINX_LOCAL_RESOLVERS} com o DNS do cluster.
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: socialclone
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: socialclone
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
# Escala pela CPU: o nginx serve o front e repassa a API para o gateway.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: socialclone
  annotations:
    # mínimo original: o botão "voltar ao automático" do monitor devolve o HPA para cá
    socialclone/default-min: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Sobe rápido (sem janela: dobra ou +2 pods a cada 15 s, o que for maior) e desce devagar
  # (2 min sem precisar dos pods, depois 1 pod a cada 30 s) até voltar ao mínimo.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
