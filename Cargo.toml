[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
platform = { path = "crates/platform" }
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
futures = "0.3"
mimalloc = { version = "0.1", default-features = false }
jsonwebtoken = "9"
# Cliente AMQP (RabbitMQ). Sem TLS: o tráfego fica dentro do cluster.
lapin = { version = "4", default-features = false, features = ["tokio"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "request-id", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
